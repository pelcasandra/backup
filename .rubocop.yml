inherit_from: .rubocop_todo.yml

AllCops:
  TargetRubyVersion: 4.0
  NewCops: disable
  SuggestExtensions: false
  Include:
    - "Gemfile"
    - "Rakefile"
    - "backup.gemspec"
  Exclude:
    - "tmp/**/*"
    - "vagrant/**/*"
    # Necessary on travis CI
    - "vendor/**/*"
  DisplayCopNames: true
  UseCache: true
  CacheRootDirectory: ./tmp

# Metrics/LineLength:
#   Max: 80

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes
  Exclude:
    - "lib/backup/cli/outbox.rb"
    - "lib/backup/storage/outbox.rb"
    - "lib/backup/uploader/**/*.rb"
    - "spec/cli/outbox_spec.rb"
    - "spec/storage/outbox_spec.rb"
    - "spec/uploader/**/*_spec.rb"

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes
  Exclude:
    - "lib/backup/cli/outbox.rb"
    - "lib/backup/storage/outbox.rb"
    - "lib/backup/uploader/**/*.rb"
    - "spec/cli/outbox_spec.rb"
    - "spec/storage/outbox_spec.rb"
    - "spec/uploader/**/*_spec.rb"

# New Ruby code follows the repository owner's private-method indentation.
Layout/EmptyLinesAroundAccessModifier:
  Exclude:
    - "lib/backup/cli/outbox.rb"
    - "lib/backup/storage/outbox.rb"
    - "lib/backup/uploader/**/*.rb"
    - "spec/cli/outbox_spec.rb"
    - "spec/storage/outbox_spec.rb"
    - "spec/uploader/**/*_spec.rb"

Layout/IndentationConsistency:
  Exclude:
    - "lib/backup/cli/outbox.rb"
    - "lib/backup/storage/outbox.rb"
    - "lib/backup/uploader/**/*.rb"
    - "spec/cli/outbox_spec.rb"
    - "spec/storage/outbox_spec.rb"
    - "spec/uploader/**/*_spec.rb"

Layout/IndentationWidth:
  Exclude:
    - "lib/backup/cli/outbox.rb"
    - "lib/backup/storage/outbox.rb"
    - "lib/backup/uploader/**/*.rb"
    - "spec/cli/outbox_spec.rb"
    - "spec/storage/outbox_spec.rb"
    - "spec/uploader/**/*_spec.rb"

Naming/MethodName:
  Exclude:
    - "lib/backup/cli/outbox.rb"

Style/MutableConstant:
  Exclude:
    - "lib/backup/storage/outbox.rb"

Layout/ParameterAlignment:
  EnforcedStyle: with_fixed_indentation

Layout/MultilineMethodCallIndentation:
  EnforcedStyle: indented

Layout/MultilineOperationIndentation:
  EnforcedStyle: indented

Style/HashSyntax:
  EnforcedStyle: ruby19

Layout/HashAlignment:
  EnforcedLastArgumentHashStyle: ignore_implicit

Layout/FirstArrayElementIndentation:
  EnforcedStyle: consistent

Style/FormatString:
  EnforcedStyle: sprintf

Style/SymbolArray:
  Enabled: false
